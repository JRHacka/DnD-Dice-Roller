<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavern Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tavern.css">
</head>
<body>
<!-- Shapes shared by both torches -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fo" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff7a1a"/><stop offset=".6" stop-color="#e2401a"/><stop offset="1" stop-color="#a51e0e" stop-opacity=".2"/></linearGradient>
    <linearGradient id="fm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffd25a"/><stop offset=".7" stop-color="#ff9a2a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity=".4"/></linearGradient>
    <linearGradient id="fc" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#ffe9a0"/></linearGradient>
  </defs>
</svg>
<div class="torch t-left" aria-hidden="true"><i class="glow"></i><i class="sconce"></i><i class="handle"></i><svg class="flame" viewBox="0 0 40 66">
    <path class="f-outer" fill="url(#fo)" d="M21 0 C22 9 26 13 29 20 C30 16 30 12 29 7 C36 16 39 28 37 40 C35 54 29 64 20 64 C11 64 4 55 3 43 C2 33 7 25 10 18 C10 23 11 26 13 29 C13 18 17 9 21 0 Z"/>
    <path class="f-mid" fill="url(#fm)" d="M19 13 C21 21 27 27 28 38 C29 50 25 59 20 59 C15 59 11 52 11 42 C11 35 14 31 16 26 C17 30 18 32 19 33 C18 26 18 20 19 13 Z"/>
    <path class="f-core" fill="url(#fc)" d="M20 33 C22 40 25 44 25 50 C25 55 23 59 20 59 C17 59 15 55 15 51 C15 46 18 41 20 33 Z"/>
  </svg><i class="ember"></i><i class="ember e2"></i><i class="ember e3"></i></div>
<div class="torch t-right" aria-hidden="true"><i class="glow"></i><i class="sconce"></i><i class="handle"></i><svg class="flame" viewBox="0 0 40 66">
    <path class="f-outer" fill="url(#fo)" d="M21 0 C22 9 26 13 29 20 C30 16 30 12 29 7 C36 16 39 28 37 40 C35 54 29 64 20 64 C11 64 4 55 3 43 C2 33 7 25 10 18 C10 23 11 26 13 29 C13 18 17 9 21 0 Z"/>
    <path class="f-mid" fill="url(#fm)" d="M19 13 C21 21 27 27 28 38 C29 50 25 59 20 59 C15 59 11 52 11 42 C11 35 14 31 16 26 C17 30 18 32 19 33 C18 26 18 20 19 13 Z"/>
    <path class="f-core" fill="url(#fc)" d="M20 33 C22 40 25 44 25 50 C25 55 23 59 20 59 C17 59 15 55 15 51 C15 46 18 41 20 33 Z"/>
  </svg><i class="ember"></i><i class="ember e2"></i><i class="ember e3"></i></div>
<header>
  <h1>Tavern Table</h1>
  <p>Roll dice, track the party, and run the fight.</p>
</header>

<main>
  <!-- DICE TRAY -->
  <section class="panel" aria-labelledby="tray-h">
    <h2 id="tray-h">Dice tray <span class="sub" id="pickedLabel">1d20</span></h2>
    <div class="dice" id="dice" role="group" aria-label="Tap a die to add it to the roll"></div>

    <div class="poolrow">
      <span class="poollabel">Rolling</span>
      <div class="chips" id="pool" aria-live="polite"></div>
      <button class="ghost small" id="clearPool" type="button">Clear</button>
    </div>

    <div class="controls">
      <div class="field">Modifier
        <div class="stepper">
          <button type="button" id="modDown" aria-label="Lower modifier">−</button>
          <output id="mod">+0</output>
          <button type="button" id="modUp" aria-label="Raise modifier">+</button>
        </div>
      </div>
      <div class="field">d20 mode
        <div class="seg" id="mode" role="group" aria-label="Advantage">
          <button type="button" data-mode="dis" aria-pressed="false">Disadv.</button>
          <button type="button" data-mode="norm" aria-pressed="true">Normal</button>
          <button type="button" data-mode="adv" aria-pressed="false">Adv.</button>
        </div>
      </div>
    </div>

    <div class="row">
      <label class="field" for="roller">Who's rolling?
        <select id="roller"></select>
      </label>
      <label class="field" for="action">What are they trying to do?
        <input id="action" type="text" placeholder="Pick the lock on the crypt door" autocomplete="off">
      </label>
    </div>

    <button class="roll-btn" id="rollBtn" type="button">Roll</button>

    <div class="result" id="result" aria-live="polite">
      <button class="skin-btn" id="skinBtn" type="button" aria-haspopup="dialog">🎨 Dice skin</button>
      <canvas id="dieCanvas" aria-hidden="true"></canvas>
      <span class="tag" id="tag" hidden></span>
      <div class="total" id="total">20</div>
      <div class="formula" id="formula">Example roll · pick your dice and hit Roll</div>
    </div>
  </section>

  <!-- PARTY / INITIATIVE -->
  <section class="panel" aria-labelledby="party-h">
    <h2 id="party-h">Party &amp; initiative <span class="sub" id="partyCount"></span></h2>
    <div class="combatbar">
      <button class="ghost" id="rollInit" type="button">Roll initiative</button>
      <button class="ghost" id="nextTurn" type="button" hidden>Next turn</button>
      <button class="ghost" id="endCombat" type="button" hidden>End combat</button>
      <button class="ghost" id="longRest" type="button">Long rest</button>
      <span class="round" id="round"></span>
    </div>
    <div class="cards" id="cards"></div>

    <details class="add">
      <summary>Add a hero or monster</summary>
      <form id="addForm" class="addgrid">
        <label class="field wide" for="fName">Name<input id="fName" required placeholder="Goblin Boss"></label>
        <label class="field" for="fCls">Class / type<input id="fCls" placeholder="Fighter"></label>
        <label class="field" for="fLvl">Level / CR<input id="fLvl" type="number" value="1" min="0"></label>
        <label class="field" for="fHp">Max HP<input id="fHp" type="number" value="10" min="1" required></label>
        <label class="field" for="fAc">AC<input id="fAc" type="number" value="12" min="1"></label>
        <label class="field" for="fInit">Init mod<input id="fInit" type="number" value="0"></label>
        <label class="field check" for="fMon"><input id="fMon" type="checkbox"> Monster</label>
        <button class="mini" type="submit">Add</button>
      </form>
    </details>
  </section>

  <!-- LOG -->
  <section class="panel log" aria-labelledby="log-h">
    <h2 id="log-h">Roll log <button class="ghost" id="clearLog" type="button">Clear</button></h2>
    <ol id="log"></ol>
  </section>
</main>

<!-- DICE SKIN MENU -->
<dialog class="skins" id="skinMenu" aria-labelledby="skin-h">
  <div class="skins-head">
    <h2 id="skin-h">Choose a dice skin</h2>
    <button class="ghost" id="skinDone" type="button">Done</button>
  </div>
  <div class="skins-body" id="skinList"></div>
  <section class="custom" aria-labelledby="custom-h">
    <h3 id="custom-h">Make your own</h3>
    <div class="customgrid">
      <label class="field">Body<input type="color" id="cBody"></label>
      <label class="field">Accent<input type="color" id="cAccent"></label>
      <label class="field">Edges<input type="color" id="cEdge"></label>
      <label class="field">Numbers<input type="color" id="cInk"></label>
      <label class="field">Pattern
        <select id="cPattern">
          <option value="solid">Solid</option>
          <option value="camo">Camo</option>
          <option value="digital">Digital camo</option>
          <option value="marble">Marble</option>
          <option value="wood">Wood grain</option>
          <option value="speckle">Speckled</option>
          <option value="galaxy">Galaxy</option>
          <option value="stripes">Tiger stripe</option>
        </select>
      </label>
      <label class="field">Finish
        <select id="cFinish">
          <option value="matte">Matte</option>
          <option value="satin">Satin</option>
          <option value="gloss">Glossy</option>
          <option value="metal">Metal</option>
        </select>
      </label>
    </div>
  </section>
</dialog>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<!-- Plain scripts (not modules), loaded in this order, so the page works when opened straight from a folder -->
<script src="js/noise.js"></script>
<script src="js/app.js"></script>
<script src="js/tray.js"></script>
<script src="js/skins.js"></script>
<script src="js/backdrop.js"></script>
<script src="js/dice3d.js"></script>
<script>
  // Start up: draw the tray, the party and the log once
  syncTray(); renderParty(); renderLog();
</script>
</body>
</html>
